[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-preprocessing"
version = "0.1.0"
description = "Research prototype for agentic scientific dataset understanding and preprocessing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "ase>=3.29.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pytest==9.1.1",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
